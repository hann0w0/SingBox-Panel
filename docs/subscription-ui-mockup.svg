<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .title { fill: #1f1f1f; font-size: 22px; font-weight: 600; }
    .heading { fill: #1f1f1f; font-size: 17px; font-weight: 600; }
    .body { fill: #1f1f1f; font-size: 14px; }
    .secondary { fill: #00000073; font-size: 13px; }
    .small { fill: #00000073; font-size: 12px; }
    .card { fill: #fff; stroke: #f0f0f0; stroke-width: 1; }
    .line { stroke: #f0f0f0; stroke-width: 1; }
    .primary { fill: #1677ff; }
    .success { fill: #52c41a; }
    .purple { fill: #722ed1; }
    .cyan { fill: #13c2c2; }
  </style>

  <rect width="1440" height="900" fill="#f5f5f5"/>
  <text x="48" y="42" class="title">Ant Design 风格 · 订阅界面</text>
  <text x="48" y="68" class="secondary">用户订阅页 / 管理员订阅管理页</text>

  <!-- User portal -->
  <rect x="40" y="98" width="660" height="750" rx="8" class="card"/>
  <rect x="40" y="98" width="660" height="64" rx="8" fill="#fff"/>
  <text x="68" y="137" class="title">SingBox <tspan fill="#1677ff">Panel</tspan></text>
  <text x="570" y="133" class="body">duidui</text>
  <rect x="608" y="116" width="64" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="623" y="137" class="body">登出</text>
  <line x1="40" y1="162" x2="700" y2="162" class="line"/>

  <text x="68" y="204" class="small">订阅中心</text>
  <text x="68" y="238" class="title">订阅与节点</text>
  <text x="68" y="264" class="secondary">复制链接后导入客户端，节点会自动同步。</text>

  <rect x="68" y="286" width="604" height="92" rx="8" class="card"/>
  <text x="88" y="315" class="small">订阅状态</text>
  <text x="88" y="348" class="heading">正常 · 永不过期</text>
  <rect x="557" y="322" width="76" height="26" rx="13" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="575" y="340" font-size="12" fill="#389e0d">2 个节点</text>

  <text x="68" y="422" class="heading">快速导入</text>
  <text x="68" y="447" class="secondary">选择客户端复制对应订阅链接</text>
  <rect x="68" y="464" width="164" height="40" rx="6" class="success"/>
  <text x="104" y="489" font-size="14" font-weight="600" fill="#fff">ClashMeta</text>
  <rect x="242" y="464" width="174" height="40" rx="6" class="purple"/>
  <text x="274" y="489" font-size="14" font-weight="600" fill="#fff">Shadowrocket</text>
  <rect x="426" y="464" width="118" height="40" rx="6" class="primary"/>
  <text x="461" y="489" font-size="14" font-weight="600" fill="#fff">Surge</text>
  <rect x="68" y="520" width="104" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="89" y="541" class="body">重置链接</text>
  <rect x="182" y="520" width="104" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="203" y="541" class="body">修改密码</text>

  <line x1="68" y1="582" x2="672" y2="582" class="line"/>
  <text x="68" y="621" class="heading">可用节点 <tspan class="secondary">2</tspan></text>
  <rect x="68" y="642" width="604" height="44" fill="#fafafa"/>
  <text x="84" y="669" class="small">节点</text>
  <text x="360" y="669" class="small">协议</text>
  <text x="475" y="669" class="small">地址</text>
  <text x="625" y="669" class="small">操作</text>
  <line x1="68" y1="686" x2="672" y2="686" class="line"/>
  <text x="84" y="717" class="body">🇺🇸 DMIT LAX · AnyTLS</text>
  <rect x="360" y="700" width="58" height="24" rx="4" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="373" y="717" class="small">anytls</text>
  <text x="475" y="717" class="body">lax.example:8443</text>
  <text x="625" y="717" font-size="13" fill="#1677ff">详情</text>
  <line x1="68" y1="738" x2="672" y2="738" class="line"/>
  <text x="84" y="769" class="body">🇺🇸 DMIT LAX · VLESS</text>
  <rect x="360" y="752" width="52" height="24" rx="4" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="374" y="769" class="small">vless</text>
  <text x="475" y="769" class="body">lax.example:5443</text>
  <text x="625" y="769" font-size="13" fill="#1677ff">详情</text>

  <!-- Admin portal -->
  <rect x="740" y="98" width="660" height="750" rx="8" class="card"/>
  <rect x="740" y="98" width="660" height="64" rx="8" fill="#fff"/>
  <text x="768" y="137" class="title">订阅</text>
  <text x="1272" y="137" class="secondary">管理员视图</text>
  <line x1="740" y1="162" x2="1400" y2="162" class="line"/>

  <text x="768" y="204" class="small">选择用户</text>
  <rect x="768" y="220" width="390" height="40" rx="6" fill="#fff" stroke="#1677ff"/>
  <text x="784" y="245" class="body">duidui · 2 个节点</text>
  <text x="1135" y="245" font-size="18" fill="#8c8c8c">⌄</text>
  <rect x="1174" y="220" width="196" height="40" rx="6" class="primary"/>
  <text x="1220" y="245" font-size="14" font-weight="600" fill="#fff">打开用户详情</text>

  <rect x="768" y="282" width="602" height="78" rx="8" fill="#fafafa" stroke="#f0f0f0"/>
  <text x="788" y="309" class="small">订阅状态</text>
  <text x="788" y="339" class="heading">正常 · 永不过期</text>
  <text x="1180" y="309" class="small">授权节点</text>
  <text x="1180" y="339" class="heading">2</text>
  <text x="1250" y="309" class="small">状态</text>
  <text x="1250" y="339" font-size="14" fill="#389e0d">正常</text>

  <text x="768" y="405" class="heading">订阅链接</text>
  <rect x="768" y="424" width="602" height="40" rx="6" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="784" y="449" class="small">https://node.example.com/sub/••••••••</text>
  <rect x="1258" y="429" width="96" height="30" rx="5" fill="#fff" stroke="#d9d9d9"/>
  <text x="1281" y="449" class="small">复制</text>
  <rect x="768" y="480" width="96" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="791" y="501" class="body">重置链接</text>
  <rect x="876" y="480" width="96" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="899" y="501" class="body">二维码</text>

  <line x1="768" y1="550" x2="1370" y2="550" class="line"/>
  <text x="768" y="589" class="heading">节点授权</text>
  <text x="1270" y="589" class="secondary">按协议授权</text>
  <rect x="768" y="610" width="602" height="44" fill="#fafafa"/>
  <text x="784" y="637" class="small">节点</text>
  <text x="1060" y="637" class="small">协议</text>
  <text x="1270" y="637" class="small">状态</text>
  <line x1="768" y1="654" x2="1370" y2="654" class="line"/>
  <text x="784" y="685" class="body">🇺🇸 DMIT LAX</text>
  <rect x="1060" y="668" width="70" height="24" rx="4" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="1075" y="685" class="small">AnyTLS</text>
  <text x="1270" y="685" font-size="13" fill="#389e0d">已授权</text>
  <line x1="768" y1="706" x2="1370" y2="706" class="line"/>
  <text x="784" y="737" class="body">🇺🇸 DMIT LAX</text>
  <rect x="1060" y="720" width="70" height="24" rx="4" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="1075" y="737" class="small">VLESS</text>
  <text x="1270" y="737" font-size="13" fill="#389e0d">已授权</text>
  <text x="768" y="786" class="small">管理员只负责用户订阅与授权，节点配置仍在“节点”模块管理。</text>
</svg>
