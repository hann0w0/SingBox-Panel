<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <filter id="card" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity=".06"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="clash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1eb85a"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="surge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22b8f0"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#f5f6f8"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1440" height="56" fill="#ffffff"/>
  <rect x="0" y="55" width="1440" height="1" fill="#eef0f3"/>
