    <rect x="98" y="0" width="38" height="38" rx="4"/><rect x="105" y="7" width="24" height="24" rx="2" fill="#fff"/><rect x="111" y="13" width="12" height="12" fill="#0f172a"/>
    <rect x="0" y="98" width="38" height="38" rx="4"/><rect x="7" y="105" width="24" height="24" rx="2" fill="#fff"/><rect x="13" y="111" width="12" height="12" fill="#0f172a"/>
    <rect x="52" y="6" width="9" height="9"/><rect x="70" y="6" width="9" height="9"/><rect x="52" y="24" width="9" height="9"/><rect x="88" y="52" width="9" height="9"/>
    <rect x="52" y="52" width="9" height="9"/><rect x="70" y="70" width="9" height="9"/><rect x="52" y="88" width="9" height="9"/><rect x="122" y="70" width="9" height="9"/>
    <rect x="98" y="98" width="9" height="9"/><rect x="116" y="98" width="9" height="9"/><rect x="98" y="116" width="9" height="9"/><rect x="122" y="122" width="9" height="9"/>
    <rect x="70" y="122" width="9" height="9"/>
  </g>
  <text x="1164" y="490" font-size="12" fill="#94a3b8" text-anchor="middle">🇺🇸 DMIT LAX - VLESS</text>

