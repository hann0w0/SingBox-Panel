  <rect x="80" y="288" width="256" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="116" cy="324" r="16" fill="url(#clash)"/><circle cx="116" cy="324" r="8" fill="none" stroke="#fff" stroke-width="2"/><circle cx="116" cy="324" r="2" fill="#fff"/>
