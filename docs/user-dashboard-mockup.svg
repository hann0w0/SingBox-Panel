  <text x="700" y="606" font-size="12" font-weight="600" fill="#94a3b8">地址</text>
  <text x="1080" y="606" font-size="12" font-weight="600" fill="#94a3b8">延迟</text>
  <text x="1360" y="606" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">操作</text>
  <rect x="80" y="620" width="1280" height="1" fill="#eef0f3"/>

