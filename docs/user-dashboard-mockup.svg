  <circle cx="1202" cy="557" r="5.5" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M1206 561 l4 4" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
