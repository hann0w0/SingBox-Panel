  <text x="80" y="668" font-size="14" font-weight="600" fill="#1e293b">🇺🇸 DMIT LAX - AnyTLS</text>
  <rect x="520" y="652" width="62" height="24" rx="4" fill="#eff6ff"/><text x="551" y="668" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">anytls</text>
  <text x="700" y="668" font-size="13" fill="#475569" font-family="'SF Mono',Menlo,monospace">lax.hannvps.de:8443</text>
  <circle cx="1086" cy="663" r="4" fill="#22c55e"/><text x="1098" y="668" font-size="13" fill="#16a34a">86ms</text>
  <text x="1360" y="668" font-size="13" font-weight="600" fill="#2f6bff" text-anchor="end">详情 / 二维码</text>

  <!-- row 2 -->
  <text x="80" y="728" font-size="14" font-weight="600" fill="#1e293b">🇺🇸 DMIT LAX - VLESS</text>
  <rect x="520" y="712" width="52" height="24" rx="4" fill="#f0fdf4"/><text x="546" y="728" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">vless</text>
  <text x="700" y="728" font-size="13" fill="#475569" font-family="'SF Mono',Menlo,monospace">lax.hannvps.de:5443</text>
  <circle cx="1086" cy="723" r="4" fill="#22c55e"/><text x="1098" y="728" font-size="13" fill="#16a34a">92ms</text>
  <text x="1360" y="728" font-size="13" font-weight="600" fill="#2f6bff" text-anchor="end">详情 / 二维码</text>
  <rect x="80" y="752" width="1280" height="1" fill="#f1f5f9"/>

  <!-- empty hint slot -->
  <text x="80" y="796" font-size="12" fill="#cbd5e1">共 2 个节点 · 已按延迟排序</text>

  <!-- floating translate FAB -->
  <g filter="url(#card)"><circle cx="1392" cy="852" r="20" fill="#ff9ba6"/></g>
  <text x="1392" y="857" font-size="14" fill="#fff" text-anchor="middle">文A</text>
