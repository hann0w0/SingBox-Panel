  <rect x="1312" y="15" width="80" height="26" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="1330" cy="28" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="1344" y="33" font-size="13" fill="#475569">登出</text>

  <!-- ===== STATUS BAND: 一行看全 状态/套餐/到期/剩余 ===== -->
  <g filter="url(#card)"><rect x="48" y="84" width="1344" height="96" rx="12" fill="url(#band)"/></g>
  <rect x="48" y="84" width="4" height="96" rx="2" fill="#22c55e"/>
  <!-- account -->
  <circle cx="96" cy="132" r="22" fill="#eef2ff"/>
  <text x="96" y="139" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="middle">D</text>
  <text x="132" y="122" font-size="15" font-weight="700" fill="#1e293b">duidui</text>
  <rect x="132" y="134" width="52" height="22" rx="4" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="158" y="149" font-size="12" fill="#389e0d" text-anchor="middle">正常</text>
