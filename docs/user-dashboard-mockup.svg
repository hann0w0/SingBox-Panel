  <rect x="80" y="408" width="668" height="44" rx="10" fill="#f8fafc" stroke="#e6eaf2"/>
  <text x="98" y="435" font-size="13" fill="#475569" font-family="'SF Mono',Menlo,monospace">https://panel.example.com/sub/9f3c…a1b2</text>
