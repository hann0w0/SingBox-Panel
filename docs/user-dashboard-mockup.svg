  <rect x="560" y="108" width="1" height="48" fill="#eef0f3"/>
  <text x="600" y="120" font-size="12" fill="#94a3b8">套餐</text>
  <text x="600" y="150" font-size="18" font-weight="700" fill="#1e293b">高级版</text>
  <rect x="900" y="108" width="1" height="48" fill="#eef0f3"/>
  <text x="940" y="120" font-size="12" fill="#94a3b8">在线节点</text>
  <text x="940" y="150" font-size="18" font-weight="700" fill="#1e293b">2<tspan font-size="13" font-weight="400" fill="#94a3b8"> / 2</tspan></text>

